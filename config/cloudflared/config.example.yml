# Cloudflare Tunnel Configuration Template for MiniLinkedIn
# Hướng dẫn cấu hình tên miền tuỳ chỉnh qua Cloudflare Zero Trust:
# 1. Đăng nhập: cloudflared tunnel login
# 2. Tạo tunnel: cloudflared tunnel create minilinkedin-tunnel
# 3. Gán file credentials vào đường dẫn bên dưới: credentials-file

tunnel: YOUR_TUNNEL_UUID_OR_NAME
credentials-file: /Users/YOUR_USERNAME/.cloudflared/YOUR_TUNNEL_UUID.json

ingress:
  # Route 1: Backend API
  - hostname: api.yourdomain.com
    service: http://localhost:5001
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Route 2: Flutter Web App
  - hostname: app.yourdomain.com
    service: http://localhost:3000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Route 3: AI Service (FastAPI) nếu có dùng
  - hostname: ai.yourdomain.com
    service: http://localhost:8000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Quy tắc bắt buộc cuối cùng: 404 cho mọi hostname khác
  - service: http_status:404
